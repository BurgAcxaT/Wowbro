<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sensor Fix</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .stat { margin-bottom: 10px; border-bottom: 1px solid #222; }
        #video { width: 100%; max-width: 400px; background: #222; }
        .error { color: #f00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="err-log" class="error"></div>
    
    <button id="btn" style="width:100%; padding:20px; font-weight:bold;">1. ВКЛЮЧИТЬ ВСЁ</button>

    <div class="stat">ACC: <span id="acc-val">wait...</span></div>
    <div class="stat">GYRO: <span id="gyro-val">wait...</span></div>
    <div class="stat">COMPASS: <span id="mag-val">wait...</span></div>
    
    <video id="video" autoplay playsinline></video>

<script>
const log = (msg) => { document.getElementById('err-log').innerHTML += msg + '<br>'; };

async function start() {
    log("Запуск...");

    // 1. Камера
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } 
        });
        document.getElementById("video").srcObject = stream;
        log("Камера: OK");
    } catch (e) {
        log("Ошибка камеры: " + e.message);
    }

    // 2. Обработчик движения
    const handleMotion = (e) => {
        const a = e.accelerationIncludingGravity;
        if (a) {
            document.getElementById("acc-val").textContent = `X:${a.x?.toFixed(1)} Y:${a.y?.toFixed(1)}`;
        }
    };

    // 3. Обработчик ориентации
    const handleOrient = (e) => {
        if (e.alpha !== null) {
            document.getElementById("mag-val").textContent = Math.round(e.alpha) + "°";
        }
    };

    // Пытаемся завести датчики (универсальный подход)
    try {
        // Для iOS (Safari)
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res === 'granted') {
                window.addEventListener("devicemotion", handleMotion);
                window.addEventListener("deviceorientation", handleOrient);
            }
        } else {
            // Для Android / Firefox / Chrome
            window.addEventListener("devicemotion", handleMotion);
            window.addEventListener("deviceorientation", handleOrient);
            log("Датчики: Слушатели добавлены");
        }
    } catch (e) {
        log("Ошибка датчиков: " + e.message);
    }
}

document.getElementById("btn").addEventListener("click", start);
</script>
</body>
</html>

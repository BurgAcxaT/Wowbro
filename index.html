<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Sensor God Mode</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #eee; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .full { grid-column: span 2; }
        .label { font-size: 0.7em; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 1.2em; color: #00ff95; font-family: monospace; }
        button { background: #3d5afe; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 1em; cursor: pointer; margin-bottom: 15px; }
        button:active { background: #1a237e; }
        #video-container { position: relative; width: 100%; height: 200px; background: #000; border-radius: 10px; overflow: hidden; display: none; margin-top: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .aim { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #color-preview { width: 100%; height: 40px; border-radius: 8px; margin-top: 10px; border: 2px solid #333; }
        .warn { color: #ff4444; font-size: 0.8em; }
    </style>
</head>
<body>
<h2 style="text-align:center;">Sensor Panel 2.0</h2>
<button onclick="initAll()">🚀 АКТИВИРОВАТЬ СИСТЕМЫ</button>
<div class="grid">
    <div class="card"><div class="label">Ухо</div><div id="prox-val" class="value">---</div></div>
    <div class="card"><div class="label">Свет</div><div id="light-val" class="value">0</div></div>
    <div class="card"><div class="label">Компас</div><div id="mag-val" class="value">0°</div></div>
    <div class="card"><div class="label">Звук</div><div id="vol-val" class="value">0</div></div>
    <div class="card full"><div class="label">Гироскоп</div><div id="gyro-val" class="value">0 | 0 | 0</div></div>
    <div class="card full"><div class="label">Акселерометр</div><div id="acc-val" class="value">X:0 Y:0 Z:0</div></div>
    <div class="card full">
        <div class="label">Цвет (камера)</div>
        <div id="video-container"><video id="video" autoplay></video><div class="aim"></div></div>
        <div id="color-hex" class="value">#000000</div>
        <div id="color-preview"></div>
    </div>
</div>
<script>
function initAll(){ alert("Файл работает"); }
</script>
</body>
</html>
